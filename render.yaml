# Blueprint de Render: crea el servicio web y la base de datos PostgreSQL.
services:
  - type: web
    name: supermass-rifa
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: supermass-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: RIFA_NOMBRE
        value: Gran Rifa Navideña SuperMass
      - key: RIFA_PREMIO
        value: Una despensa de $5,000
      - key: RIFA_FECHA
        value: Sábado 19 de diciembre de 2026
      - key: TIENDA_DIRECCION
        value: Calle Agave 328, Los Magueyes, C.P. 78100, San Luis Potosí, S.L.P.
      - key: TIENDA_TELEFONO
        value: "4447079619"
      - key: FACEBOOK_URL
        value: https://www.facebook.com/1291426010723582
      - key: FACEBOOK_PAGE_ID
        value: "1291426010723582"
      - key: FACEBOOK_PAGE_TOKEN
        sync: false
      - key: TIENDA_WHATSAPP
        sync: false
      - key: TIENDA_HORARIO
        value: Todos los días de 7:00 a 23:00
      - key: TIENDA_ZONA_ENVIO
        value: Los Magueyes y colonias cercanas

databases:
  - name: supermass-db
    plan: free
    databaseName: supermass
    user: supermass
